[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "callglance"
dynamic = ["version"]
description = "Know at a glance whether your connection is good enough for calls, and whether your Wi-Fi or your ISP is to blame."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "rafay-ah" }]
keywords = ["network", "latency", "jitter", "packet-loss", "wifi", "gnome", "video-calls"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
# PyGObject (python3-gi) comes from the distribution; the measurement engine itself is stdlib-only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
callglance = "callglance.cli:main"

[project.urls]
Homepage = "https://github.com/rafay-ah/callglance"
Issues = "https://github.com/rafay-ah/callglance/issues"

[tool.setuptools.dynamic]
version = { attr = "callglance.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
callglance = ["data/*", "data/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
